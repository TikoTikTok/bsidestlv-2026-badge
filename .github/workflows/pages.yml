# Publishes the site to GitHub Pages. The site is plain static files at the
# repository root - no build step, no bundler - so this stages the pages the
# site actually needs and uploads them.
#
# Staging rather than uploading the whole repo keeps the artifact ~4MB instead
# of ~34MB: hardware/, software/ and the reference sheets are not part of the
# site and do not need publishing.
#
# The one thing built on the way is the firmware: flash.html offers it to the
# badge over WebUSB, so the deploy cross-builds software/controller (via
# build-uf2.yml) and publishes it as firmware/glitch.uf2 with a manifest,
# firmware/index.json, that says which commit it came from.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions". The
# workflow token cannot switch Pages on by itself (configure-pages'
# `enablement` needs a personal token with admin rights), so this is a click.
name: Pages

on:
  push:
    # main, plus the branch the flash page is being developed on, so the
    # fork publishes the work in progress. Drop the second entry on merge.
    branches: [main, claude/flash-from-browser]
    paths:
      - 'index.html'
      - 'glitch.html'
      - 'flash.html'
      - 'styles.css'
      - 'src/**'
      - 'stages/**'
      - 'assets/**'
      - 'software/controller/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/build-uf2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  firmware:
    uses: ./.github/workflows/build-uf2.yml

  deploy:
    needs: firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify both stages are solvable, the range is honest and the flasher behaves, before publishing
        run: npm run verify

      - name: Stage the site
        run: |
          mkdir _site
          cp -r index.html glitch.html flash.html styles.css src stages assets .nojekyll _site/

      - uses: actions/download-artifact@v4
        with:
          name: controller.uf2
          path: _site/firmware

      - name: Name the image and write the manifest flash.html reads
        env:
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mv _site/firmware/controller.uf2 _site/firmware/glitch.uf2
          python3 - <<'EOF'
          import datetime, hashlib, json, os
          root = '_site/firmware'
          images = {}
          for name, file in [('glitch', 'glitch.uf2')]:
              data = open(os.path.join(root, file), 'rb').read()
              images[name] = {'file': file, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                              'source': 'software/controller'}
          manifest = {
              'built': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'commit': os.environ['GITHUB_SHA'],
              'branch': os.environ['BRANCH'],
              'repository': os.environ['REPOSITORY'],
              'images': images,
          }
          with open(os.path.join(root, 'index.json'), 'w') as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
