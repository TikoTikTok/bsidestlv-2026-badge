# Publishes the site to GitHub Pages. The site is plain static files at the
# repository root - no build step, no bundler - so this stages the pages the
# site actually needs and uploads them.
#
# Staging rather than uploading the whole repo keeps the artifact ~4MB instead
# of ~34MB: hardware/, software/ and the reference sheets are not part of the
# site and do not need publishing.
#
# No setup: the first run enables Pages on the repository itself (the
# `enablement` input below), with "GitHub Actions" as the source.
name: Pages

on:
  push:
    # main, plus the branch the glitch range is being developed on, so the
    # fork publishes the work in progress. Drop the second entry on merge.
    branches: [main, claude/glitch-practice-game-controller-65vgkh]
    paths:
      - 'index.html'
      - 'glitch.html'
      - 'styles.css'
      - 'src/**'
      - 'stages/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify both stages are solvable, and the range is honest, before publishing
        run: npm run verify

      - name: Stage the site
        run: |
          mkdir _site
          cp -r index.html glitch.html styles.css src stages assets .nojekyll _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
