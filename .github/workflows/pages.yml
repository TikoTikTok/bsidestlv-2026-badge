# Publishes software/site/ to GitHub Pages. The site is plain static files -
# no build step, no bundler - so this only uploads and deploys.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'software/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify both stages are solvable before publishing
        run: |
          cd software
          node tools/verify-stage.mjs
          node tools/verify-chase.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: software/site

      - id: deployment
        uses: actions/deploy-pages@v4
